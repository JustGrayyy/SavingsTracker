<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MultiTracker</title>
    <link rel="stylesheet" href="/src/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }

        .container {
            background: var(--bg-card);
            padding: var(--space-5);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
        }

        .logo-area {
            text-align: left;
            margin-bottom: var(--space-4);
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: var(--space-2);
            display: inline-block;
            color: var(--accent);
        }

        h1 {
            font-size: var(--text-3xl);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-top: var(--space-1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-base);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            margin-top: var(--space-1);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch {
            text-align: center;
            margin-top: var(--space-3);
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .switch a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .switch a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .error-message {
            background: var(--error-bg);
            color: var(--error);
            padding: var(--space-2);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            display: none;
            text-align: center;
            font-size: var(--text-sm);
            font-weight: 500;
            border: 1px solid var(--error-border);
        }

        .success-message {
            background: var(--success-bg);
            color: var(--success);
            padding: var(--space-2);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            display: none;
            text-align: center;
            font-size: var(--text-sm);
            font-weight: 500;
            border: 1px solid var(--success-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">MT</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join MultiTracker today</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" maxlength="30" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>
        <p class="switch">
            Already have an account? <a href="signin.html">Sign In</a>
        </p>
    </div>

    <script type="module">
        import { signUp } from './src/auth.js'

        const form = document.getElementById('loginForm')
        const errorMessage = document.getElementById('errorMessage')
        const successMessage = document.getElementById('successMessage')
        const submitBtn = document.getElementById('submitBtn')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            const username = document.getElementById('username').value.trim()
            const password = document.getElementById('password').value

            errorMessage.style.display = 'none'
            successMessage.style.display = 'none'

            if (username.length < 3) {
                errorMessage.textContent = 'Username must be at least 3 characters long.'
                errorMessage.style.display = 'block'
                return
            }

            if (password.length < 6) {
                errorMessage.textContent = 'Password must be at least 6 characters long.'
                errorMessage.style.display = 'block'
                return
            }

            submitBtn.disabled = true
            submitBtn.textContent = 'Creating account...'

            try {
                const result = await signUp(username, password)

                if (result.success) {
                    if (result.requiresConfirmation) {
                        successMessage.textContent = result.message || 'Account created! You can now sign in.'
                        successMessage.style.display = 'block'
                        setTimeout(() => {
                            window.location.href = 'signin.html'
                        }, 2000)
                    } else {
                        successMessage.textContent = 'Account created successfully! Redirecting...'
                        successMessage.style.display = 'block'
                        setTimeout(() => {
                            window.location.href = 'tasks.html'
                        }, 1000)
                    }
                } else {
                    errorMessage.textContent = result.error
                    errorMessage.style.display = 'block'
                    submitBtn.disabled = false
                    submitBtn.textContent = 'Create Account'
                }
            } catch (err) {
                errorMessage.textContent = 'An unexpected error occurred. Please try again.'
                errorMessage.style.display = 'block'
                submitBtn.disabled = false
                submitBtn.textContent = 'Create Account'
            }
        })
    </script>
</body>
</html>
