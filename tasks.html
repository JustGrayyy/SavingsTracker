<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - MultiTracker</title>
    <link rel="stylesheet" href="/src/theme.css">
    <link rel="stylesheet" href="/src/nav.css">
    <style>
        /* ---------------------------------------------------------------------------
           PAGE-SPECIFIC STYLES
           --------------------------------------------------------------------------- */

        /* Page shell - prevent horizontal bleed on desktop */
        main {
            min-width: 0;
            overflow-x: clip;
        }

        main > h1 {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* Filter bar - wrap cleanly, never force page scroll */
        .filter-bar {
            min-width: 0;
        }

        .filter-bar select {
            flex: 1 1 160px;
            min-width: 0;
            max-width: 100%;
        }

        .filter-count {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .filter-hint {
            max-width: none;
            overflow-wrap: anywhere;
        }

        /* Tasks Grid */
        .tasks-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            min-width: 0;
        }

        /* Task Section */
        .task-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-2);
            min-width: 0;
            overflow: hidden;
        }

        .task-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-2);
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-2);
            border-bottom: 1px solid var(--border);
            min-width: 0;
        }

        .task-section-header h2 {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-section-header .section-count {
            font-size: var(--text-xs);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .task-section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 280px));
            justify-content: start;
            gap: var(--space-2);
        }

        .task-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-2);
            transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
            min-width: 0;
        }

        .task-card.is-done {
            opacity: 0.55;
        }

        /* Inverse of is-done: push due-today / overdue forward with weight, not new color */
        .task-card.is-due-today,
        .task-card.is-overdue {
            border-color: var(--border-strong);
            background: var(--bg-elevated);
            box-shadow: var(--shadow-sm);
        }

        .task-card.is-due-today .due-meta,
        .task-card.is-overdue .due-meta {
            color: var(--text-primary);
            font-weight: 600;
        }

        .task-card.is-due-today .task-title,
        .task-card.is-overdue .task-title {
            font-weight: 800;
        }

        .task-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-2);
            margin-bottom: var(--space-1);
            min-width: 0;
        }

        .task-title-stack {
            min-width: 0;
            flex: 1;
        }

        .task-title-eyebrow {
            display: inline-block;
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: var(--tracking-eyebrow);
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .task-title {
            font-size: var(--text-base);
            font-weight: 700;
            color: var(--text-primary);
            line-height: var(--leading-tight);
            min-width: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            white-space: normal;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .task-meta {
            font-size: var(--text-xs);
            color: var(--text-secondary);
            margin-bottom: var(--space-1);
        }

        .meta-sep {
            color: var(--text-muted);
            margin: 0 6px;
        }

        .due-meta {
            font-size: var(--text-xs);
            color: var(--text-secondary);
            margin-bottom: var(--space-1);
        }

        .task-link {
            display: inline-flex;
            align-items: center;
            font-size: var(--text-xs);
            color: var(--text-secondary);
            text-decoration: underline;
            text-underline-offset: 2px;
            font-weight: 600;
        }

        .task-link:hover {
            color: var(--text-primary);
        }

        .task-details {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            line-height: var(--leading-relaxed);
            margin-bottom: var(--space-2);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
            padding-top: var(--space-2);
            border-top: 1px solid var(--border);
        }

        .status-changer {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            font-size: var(--text-sm);
            color: var(--text-primary);
            background: var(--bg-elevated);
            cursor: pointer;
            transition: border-color var(--duration-fast) var(--ease-out);
        }

        .status-changer:focus {
            outline: none;
            border-color: var(--accent);
        }

        .task-actions {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .action-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .action-btn.delete-btn {
            border-color: var(--error-border);
            color: var(--error);
            background: var(--error-bg);
        }

        .action-btn.delete-btn:hover {
            background: var(--error);
            color: var(--bg);
        }

        /* Form layout inside task modal (theme owns .modal-overlay / .active) */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: var(--tracking-eyebrow);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: var(--text-primary);
            background: var(--bg);
            transition: border-color var(--duration-fast) var(--ease-out);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }

        .empty-state {
            text-align: center;
            padding: var(--space-6) var(--space-3);
            color: var(--text-muted);
        }

        .empty-state .big {
            font-size: 48px;
            margin-bottom: var(--space-2);
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }

        .empty-state p {
            font-size: var(--text-sm);
        }

        @media (max-width: 768px) {
            .task-section {
                padding: var(--space-2);
            }

            .task-section-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }


   </style>


</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Multi<span>Tracker</span></div>
            <div class="nav-links">
                <a href="tasks.html" class="active">Tasks</a>
                <a href="schedule.html">Schedule</a>
                <a href="notes.html">Notes</a>
                <a href="savings.html">Savings</a>
                <a href="profile.html">Profile</a>
            </div>
        </div>
    </nav>

    <main>
        <h1>Academic Tasks</h1>

        <div class="filter-bar">
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">All Status</option>
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
                <option value="overdue">Overdue</option>
            </select>
            <select id="filterType" onchange="applyFilters()">
                <option value="">All Types</option>
                <option value="assignment">Assignment</option>
                <option value="exam">Exam</option>
                <option value="project">Project</option>
                <option value="reading">Reading</option>
                <option value="other">Other</option>
            </select>
            <select id="filterPriority" onchange="applyFilters()">
                <option value="">All Priority</option>
                <option value="urgent">Urgent</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <select id="sortBy" onchange="applyFilters()">
                <option value="due_soon">Sort: Due soon</option>
                <option value="due_late">Sort: Due later</option>
                <option value="priority">Sort: Priority</option>
                <option value="status">Sort: Status</option>
                <option value="subject">Sort: Subject</option>
            </select>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="tasks-grid" id="tasksGrid"></div>

        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📚</div>
            <h3>No tasks yet</h3>
            <p>Click the button below to add your first academic task.</p>
        </div>
    </main>

    <button class="add-btn" onclick="openCreateModal()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <!-- Create / Edit Modal -->
    <div class="modal-overlay" id="taskModal" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Create Task</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject *</label>
                        <input type="text" id="fSubject" placeholder="e.g. Mathematics">
                    </div>
                    <div class="form-group">
                        <label>Type *</label>
                        <select id="fType">
                            <option value="assignment">Assignment</option>
                            <option value="exam">Exam</option>
                            <option value="project">Project</option>
                            <option value="reading">Reading</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="fTitle" placeholder="e.g. Chapter 5 Problem Set">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="fPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="fStatus">
                            <option value="todo" selected>To Do</option>
                            <option value="in_progress">In Progress</option>
                            <option value="done">Done</option>
                            <option value="overdue">Overdue</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Date Given</label>
                        <input type="date" id="fDateGiven">
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="fDueDate">
                    </div>
                </div>

                <div class="form-group">
                    <label>Details</label>
                    <textarea id="fDetails" placeholder="Instructions, requirements, context..."></textarea>
                </div>

                <div class="form-group">
                    <label>Links / Files</label>
                    <input type="text" id="fLinks" placeholder="Paste URL(s) e.g. https://drive.google.com/...">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-delete" id="deleteBtn" style="display:none;" onclick="triggerDelete()">Delete Task</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="saveBtn" onclick="saveTask()">Create Task</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { requireAuth } from './src/auth.js'
        import { fetchTasks, createTask, updateTask, deleteTask as apiDeleteTask } from './src/tasks.js'

        const STATUS_LABEL = { todo: 'To Do', in_progress: 'In Progress', done: 'Done', overdue: 'Overdue' }
        const PRIORITY_LABEL = { urgent: 'Urgent', high: 'High', medium: 'Medium', low: 'Low' }
        const TYPE_LABEL = { assignment: 'Assignment', exam: 'Exam', project: 'Project', reading: 'Reading', other: 'Other' }

        let tasks = []
        let currentEditId = null

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        }

        function clearForm() {
            document.getElementById('fSubject').value = ''
            document.getElementById('fTitle').value = ''
            document.getElementById('fType').value = 'assignment'
            document.getElementById('fPriority').value = 'medium'
            document.getElementById('fStatus').value = 'todo'
            document.getElementById('fDateGiven').value = ''
            document.getElementById('fDueDate').value = ''
            document.getElementById('fDetails').value = ''
            document.getElementById('fLinks').value = ''
        }

        // Parse YYYY-MM-DD as local calendar day (avoids UTC midnight shift).
        function parseLocalDate(isoDate) {
            const [y, m, d] = String(isoDate).slice(0, 10).split('-').map(Number)
            return new Date(y, m - 1, d)
        }

        function startOfLocalDay(d = new Date()) {
            const day = new Date(d)
            day.setHours(0, 0, 0, 0)
            return day
        }

        function getDueDiffDays(task) {
            if (!task.dueDate) return null
            const today = startOfLocalDay()
            const due = startOfLocalDay(parseLocalDate(task.dueDate))
            return Math.round((due - today) / (1000 * 60 * 60 * 24))
        }

        // Display section only — done always wins; past due (local day) → overdue.
        function getSectionKey(task) {
            if (task.status === 'done') return 'done'
            const diff = getDueDiffDays(task)
            if (diff !== null && diff < 0) return 'overdue'
            return task.status || 'todo'
        }

        function getDueBadge(task) {
            const diffDays = getDueDiffDays(task)
            if (diffDays === null) return ''
            // Calendar-day diff in local (PH) time — same approach as schedule.html.
            // Math.ceil on remaining ms wrongly made "today afternoon" read as "tomorrow".
            let label = ''
            if (diffDays < 0) label = `Overdue ${Math.abs(diffDays)}d`
            else if (diffDays === 0) label = 'Due today'
            else if (diffDays === 1) label = 'Due tomorrow'
            else label = `Due in ${diffDays}d`
            return `<div class="due-meta">${label}</div>`
        }

        function getLinkHtml(task) {
            if (!task.links) return ''
            return `<a class="task-link" href="${escapeHtml(task.links)}" target="_blank" rel="noopener">Open link</a>`
        }

        function getFilteredTasks() {
            const type = document.getElementById('filterType').value
            const priority = document.getElementById('filterPriority').value
            const status = document.getElementById('filterStatus').value
            const sortBy = document.getElementById('sortBy').value

            let list = tasks.filter(task => {
                if (type && task.taskType !== type) return false
                if (priority && task.priority !== priority) return false
                if (status && getSectionKey(task) !== status) return false
                return true
            })

            const dueScore = task => task.dueDate ? parseLocalDate(task.dueDate).getTime() : Infinity
            const priorityScore = p => ({ urgent: 3, high: 2, medium: 1, low: 0 }[p] ?? 1)
            const statusScore = s => ({ overdue: 0, done: 1, todo: 2, in_progress: 3 }[s] ?? 4)

            list = [...list].sort((a, b) => {
                if (sortBy === 'due_late') return dueScore(b) - dueScore(a) || priorityScore(b.priority) - priorityScore(a.priority)
                if (sortBy === 'priority') return priorityScore(b.priority) - priorityScore(a.priority) || dueScore(a) - dueScore(b)
                if (sortBy === 'status') return statusScore(a.status) - statusScore(b.status) || dueScore(a) - dueScore(b)
                if (sortBy === 'subject') return (a.subject || '').localeCompare(b.subject || '') || dueScore(a) - dueScore(b)
                return dueScore(a) - dueScore(b) || priorityScore(b.priority) - priorityScore(a.priority)
            })

            return list
        }

        function renderTaskCard(task) {
            const dueBadge = getDueBadge(task)
            const linkHtml = getLinkHtml(task)
            const sectionKey = getSectionKey(task)
            const isDone = sectionKey === 'done'
            const isOverdue = sectionKey === 'overdue'
            const isDueToday = !isDone && !isOverdue && getDueDiffDays(task) === 0
            const stateClass = isDone ? ' is-done' : (isOverdue ? ' is-overdue' : (isDueToday ? ' is-due-today' : ''))
            return `
                <article class="task-card${stateClass}" data-id="${task.id}">
                    <div class="task-top">
                        <div class="task-title-stack">
                            <span class="task-title-eyebrow">${escapeHtml(task.subject || 'task')}</span>
                            <div class="task-title" title="${escapeHtml(task.title)}">${escapeHtml(task.title)}</div>
                        </div>
                        <button class="icon-btn" onclick="openEditModal('${task.id}')" title="Edit">
                            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        </button>
                    </div>
                    <div class="task-details-wrap">
                        ${task.details ? `<div class="task-details">${escapeHtml(task.details)}</div>` : ''}
                        <div class="task-meta">
                            <span>${STATUS_LABEL[task.status] || task.status}</span>
                            <span class="meta-sep">·</span>
                            <span>${PRIORITY_LABEL[task.priority] || task.priority}</span>
                            <span class="meta-sep">·</span>
                            <span>${TYPE_LABEL[task.taskType] || task.taskType}</span>
                        </div>
                        ${dueBadge}
                        ${linkHtml}
                    </div>
                    <div class="task-footer">
                        <select class="status-changer" onchange="quickStatus('${task.id}', this.value)">
                            <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>To Do</option>
                            <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                            <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
                            <option value="overdue" ${task.status === 'overdue' ? 'selected' : ''}>Overdue</option>
                        </select>
                        <div class="task-actions">
                            <button class="action-btn delete-btn" onclick="confirmDelete('${task.id}')">Delete</button>
                        </div>
                    </div>
                </article>
            `
        }

        function renderTasks() {
            const filtered = getFilteredTasks()
            const grid = document.getElementById('tasksGrid')
            const empty = document.getElementById('emptyState')
            const countEl = document.getElementById('filterCount')

            countEl.textContent = `${filtered.length} task${filtered.length !== 1 ? 's' : ''}`

            if (!filtered.length) {
                grid.innerHTML = ''
                grid.style.display = 'none'
                empty.style.display = 'block'
                return
            }

            empty.style.display = 'none'
            grid.style.display = 'flex'

            const sections = {}
            filtered.forEach(task => {
                const key = getSectionKey(task)
                if (!sections[key]) sections[key] = []
                sections[key].push(task)
            })

            const statusOrder = ['overdue', 'todo', 'in_progress', 'done']
            const sectionOrder = [
                ...statusOrder.filter(status => sections[status]),
                ...Object.keys(sections).filter(status => !statusOrder.includes(status)).sort((a, b) => a.localeCompare(b))
            ]

            grid.innerHTML = sectionOrder.map(status => {
                const sectionTasks = sections[status] || []
                return `
                    <section class="task-section">
                        <header class="task-section-header">
                            <h2>${escapeHtml(STATUS_LABEL[status] || status)}</h2>
                            <span class="section-count">${sectionTasks.length}</span>
                        </header>
                        <div class="task-section-grid">
                            ${sectionTasks.map(renderTaskCard).join('')}
                        </div>
                    </section>
                `
            }).join('')
        }

        function openCreateModal() {
            currentEditId = null
            clearForm()
            document.getElementById('modalTitle').textContent = 'Create Task'
            document.getElementById('saveBtn').textContent = 'Create Task'
            document.getElementById('deleteBtn').style.display = 'none'
            document.getElementById('taskModal').classList.add('active')
        }

        function openEditModal(id) {
            const task = tasks.find(t => t.id === id)
            if (!task) return
            currentEditId = id
            document.getElementById('fSubject').value = task.subject || ''
            document.getElementById('fTitle').value = task.title || ''
            document.getElementById('fType').value = task.taskType || 'assignment'
            document.getElementById('fPriority').value = task.priority || 'medium'
            document.getElementById('fStatus').value = task.status || 'todo'
            document.getElementById('fDateGiven').value = task.dateGiven || ''
            document.getElementById('fDueDate').value = task.dueDate || ''
            document.getElementById('fDetails').value = task.details || ''
            document.getElementById('fLinks').value = task.links || ''
            document.getElementById('modalTitle').textContent = 'Edit Task'
            document.getElementById('saveBtn').textContent = 'Save Changes'
            document.getElementById('deleteBtn').style.display = 'inline-flex'
            document.getElementById('taskModal').classList.add('active')
        }

        function closeModal(e) {
            if (e && e.target && e.currentTarget && e.target !== e.currentTarget) return
            document.getElementById('taskModal').classList.remove('active')
            currentEditId = null
        }

        async function saveTask() {
            const subject = document.getElementById('fSubject').value.trim()
            const title = document.getElementById('fTitle').value.trim()
            if (!subject || !title) {
                alert('Subject and Title are required.')
                return
            }

            const payload = {
                subject,
                title,
                taskType: document.getElementById('fType').value,
                priority: document.getElementById('fPriority').value,
                status: document.getElementById('fStatus').value,
                dateGiven: document.getElementById('fDateGiven').value || null,
                dueDate: document.getElementById('fDueDate').value || null,
                details: document.getElementById('fDetails').value.trim() || null,
                links: document.getElementById('fLinks').value.trim() || null
            }

            const btn = document.getElementById('saveBtn')
            const editing = !!currentEditId
            btn.disabled = true
            btn.textContent = 'Saving...'

            try {
                const res = editing ? await updateTask(currentEditId, payload) : await createTask(payload)
                if (!res.success) {
                    alert(res.error || 'Failed to save task')
                    return
                }
                tasks = await fetchTasks()
                renderTasks()
                closeModal()
            } finally {
                btn.disabled = false
                btn.textContent = editing ? 'Save Changes' : 'Create Task'
            }
        }

        async function deleteTaskById(id) {
            const res = await apiDeleteTask(id)
            if (!res.success) return alert(res.error || 'Failed')
            tasks = await fetchTasks()
            renderTasks()
            return true
        }

        async function triggerDelete() {
            if (!currentEditId) return
            if (!confirm('Delete this task?')) return
            await deleteTaskById(currentEditId)
            closeModal()
        }

        async function quickStatus(id, status) {
            const res = await updateTask(id, { status })
            if (!res.success) {
                alert(res.error || 'Failed')
                return
            }
            tasks = await fetchTasks()
            renderTasks()
        }

        async function confirmDelete(id) {
            if (!confirm('Delete this task?')) return
            await deleteTaskById(id)
            if (currentEditId === id) closeModal()
        }

        function applyFilters() {
            renderTasks()
        }

        async function init() {
            await requireAuth()
            tasks = await fetchTasks()
            renderTasks()
        }

        window.openCreateModal = openCreateModal
        window.openEditModal = openEditModal
        window.closeModal = closeModal
        window.saveTask = saveTask
        window.triggerDelete = triggerDelete
        window.deleteTask = triggerDelete
        window.quickStatus = quickStatus
        window.confirmDelete = confirmDelete
        window.applyFilters = applyFilters

        init()
    </script>
</body>
</html>
