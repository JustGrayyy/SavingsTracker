<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MultiTracker</title>
    <link rel="stylesheet" href="/src/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }

        .container {
            background: var(--bg-card);
            padding: var(--space-5);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
        }

        .logo-area {
            text-align: left;
            margin-bottom: var(--space-4);
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: var(--space-2);
            display: inline-block;
            color: var(--accent);
        }

        h1 {
            font-size: var(--text-3xl);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-top: var(--space-1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-base);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            margin-top: var(--space-1);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch {
            text-align: center;
            margin-top: var(--space-3);
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .switch a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .switch a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .error-message {
            background: var(--error-bg);
            color: var(--error);
            padding: var(--space-2);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            display: none;
            text-align: center;
            font-size: var(--text-sm);
            font-weight: 500;
            border: 1px solid var(--error-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">MT</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to track savings & academic tasks</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <form id="signinForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
        <p class="switch">
            Don't have an account? <a href="login.html">Create Account</a>
        </p>
    </div>

    <script type="module">
        import { signIn } from './src/auth.js'

        const form = document.getElementById('signinForm')
        const errorMessage = document.getElementById('errorMessage')
        const submitBtn = document.getElementById('submitBtn')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            const username = document.getElementById('username').value.trim()
            const password = document.getElementById('password').value

            errorMessage.style.display = 'none'

            submitBtn.disabled = true
            submitBtn.textContent = 'Signing in...'

            try {
                const result = await signIn(username, password)
                if (result.success) {
                    window.location.href = 'tasks.html'
                } else {
                    errorMessage.textContent = result.error
                    errorMessage.style.display = 'block'
                    submitBtn.disabled = false
                    submitBtn.textContent = 'Sign In'
                }
            } catch (err) {
                errorMessage.textContent = 'An unexpected error occurred. Please try again.'
                errorMessage.style.display = 'block'
                submitBtn.disabled = false
                submitBtn.textContent = 'Sign In'
            }
        })
    </script>
</body>
</html>
