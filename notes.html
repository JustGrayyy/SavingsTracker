<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - MultiTracker</title>
    <link rel="stylesheet" href="/src/theme.css">
    <link rel="stylesheet" href="/src/nav.css">
    <style>
        /* ─────────────────────────────────────────────────────────────
           PAGE-SPECIFIC STYLES
           ───────────────────────────────────────────────────────────── */

        /* Page shell */
        main {
            min-width: 0;
            overflow-x: clip;
        }

        main > h1 {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* Split layout - sidebar + editor */
        .notes-shell {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: var(--space-3);
            min-height: calc(100vh - 120px);
        }

        /* Sidebar / List Panel */
        .list-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: fit-content;
            max-height: calc(100vh - 120px);
        }

        .list-toolbar {
            padding: var(--space-3);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .list-toolbar input[type="search"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            background: var(--bg-elevated);
            color: var(--text-primary);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .list-toolbar input[type="search"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-muted);
        }

        .list-toolbar input[type="search"]::placeholder {
            color: var(--text-muted);
        }

        .list-controls {
            display: flex;
            gap: var(--space-1);
            flex-wrap: wrap;
        }

        .list-controls select,
        .chip-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .list-controls select:focus,
        .chip-btn:focus {
            outline: none;
            border-color: var(--accent);
        }

        .chip-btn.active {
            background: var(--accent-muted);
            border-color: var(--accent);
            color: var(--accent);
        }

        .chip-btn:hover:not(.active) {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .note-list {
            overflow-y: auto;
            flex: 1;
            padding: var(--space-2);
            min-height: 0;
        }

        .note-row {
            padding: var(--space-2);
            border-radius: var(--radius-md);
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: var(--space-1);
            transition: all var(--duration-fast) var(--ease-out);
            position: relative;
        }

        .note-row:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .note-row.active {
            background: var(--accent-muted);
            border-color: var(--accent);
        }

        .note-row .nr-title {
            font-size: var(--text-sm);
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .note-row .nr-snippet {
            font-size: var(--text-xs);
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .note-row .nr-meta {
            font-size: var(--text-xs);
            color: var(--text-muted);
            display: flex;
            gap: var(--space-1);
            flex-wrap: wrap;
            align-items: center;
        }

        .tag-pill {
            background: var(--accent-muted);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .list-empty {
            text-align: center;
            padding: var(--space-5) var(--space-2);
            color: var(--text-muted);
            font-size: var(--text-sm);
        }

        .note-row-del {
            position: absolute;
            top: var(--space-2);
            right: var(--space-2);
            width: 28px;
            height: 28px;
            border: 1px solid var(--error-border);
            background: var(--error-bg);
            color: var(--error);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--text-base);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
            z-index: 2;
        }

        .note-row:hover .note-row-del,
        .note-row.active .note-row-del {
            opacity: 1;
        }

        .note-row-del:hover {
            background: var(--error);
            color: var(--bg);
        }

        @media (max-width: 768px) {
            .note-row-del {
                opacity: 1;
            }
        }

        /* Editor Panel */
        .editor-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            max-height: calc(100vh - 120px);
        }

        .editor-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: var(--space-2);
            padding: var(--space-5);
            text-align: center;
        }

        .editor-empty .big {
            font-size: 48px;
            opacity: 0.5;
        }

        .editor-empty h3 {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--text-primary);
        }

        .editor-empty p {
            font-size: var(--text-sm);
            max-width: 280px;
        }

        .editor-head {
            padding: var(--space-3);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .editor-head-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .back-btn {
            display: none;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-weight: 600;
            font-size: var(--text-sm);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .back-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        #noteTitle {
            flex: 1;
            border: none;
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            background: transparent;
            min-width: 0;
            padding: 0;
            font-family: inherit;
        }

        #noteTitle:focus {
            outline: none;
        }

        #noteTitle::placeholder {
            color: var(--text-muted);
        }

        .editor-actions {
            display: flex;
            gap: var(--space-1);
            flex-wrap: wrap;
            align-items: center;
            row-gap: 8px;
        }

        .icon-btn {
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            white-space: nowrap;
            min-width: 64px;
            max-width: 100%;
        }

        .icon-btn.on {
            color: var(--text-primary);
        }

        .icon-btn.danger {
            color: var(--text-secondary);
            border-color: var(--border);
        }

        .icon-btn.danger:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }

        .font-size-btn {
            min-width: 44px;
            padding-inline: 8px;
            font-family: var(--font-mono);
            letter-spacing: 0;
            flex: 0 0 auto;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .icon-btn.on {
            background: var(--accent-muted);
            border-color: var(--accent);
            color: var(--accent);
        }

        .icon-btn.danger {
            color: var(--error);
            border-color: var(--error-border);
        }

        .icon-btn.danger:hover {
            background: var(--error);
            color: var(--bg);
        }

        .save-status {
            font-size: var(--text-xs);
            color: var(--text-muted);
            font-weight: 600;
            margin-left: auto;
        }

        .save-status.saving {
            color: var(--warning);
        }

        .save-status.saved {
            color: var(--success);
        }

        .toolbar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            padding: var(--space-2) var(--space-3);
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
            align-items: center;
        }


        .toolbar button {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: var(--text-sm);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar button:hover {
            background: var(--accent-muted);
            color: var(--accent);
            border-color: var(--accent);
        }

        .toolbar button.active {
            background: var(--accent-muted);
            color: var(--accent);
            border-color: var(--accent);
        }

        #noteEditor {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-3);
            font-size: var(--text-base);
            line-height: var(--leading-relaxed);
            color: var(--text-primary);
            outline: none;
            min-height: 200px;
            background: transparent;
            font-family: inherit;
        }

        #noteEditor:empty:before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            pointer-events: none;
        }

        #noteEditor ul,
        #noteEditor ol {
            padding-left: var(--space-4);
            margin: var(--space-2) 0;
        }

        #noteEditor li {
            margin: 4px 0;
        }

        .check-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-2);
            margin: 6px 0;
            padding: 4px 0;
        }

        .check-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 3px;
            accent-color: var(--accent);
            flex-shrink: 0;
            cursor: pointer;
        }

        .check-item.done span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .tags-row {
            padding: var(--space-2) var(--space-3);
            border-top: 1px solid var(--border);
            display: flex;
            gap: var(--space-2);
            align-items: center;
            background: var(--bg-surface);
        }

        .tags-row label {
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: var(--tracking-eyebrow);
            white-space: nowrap;
        }

        #noteTags {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: var(--text-sm);
            background: var(--bg-elevated);
            color: var(--text-primary);
            transition: all var(--duration-fast) var(--ease-out);
        }

        #noteTags:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-muted);
        }

        #noteTags::placeholder {
            color: var(--text-muted);
        }

        /* FAB - Floating Action Button */
        .add-btn {
            position: fixed;
            bottom: var(--space-4);
            right: var(--space-4);
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all var(--duration-normal) var(--ease-out-expo);
            border: none;
            z-index: var(--z-sticky);
        }

        .add-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .add-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--bg);
        }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            .notes-shell {
                grid-template-columns: 1fr;
            }

            .shell.editing .list-panel {
                display: none;
            }

            .shell:not(.editing) .editor-panel {
                display: none;
            }

            .back-btn {
                display: inline-flex;
            }

            .list-panel,
            .editor-panel {
                max-height: none;
                min-height: 70vh;
            }
        }

        @media (max-width: 768px) {
            .notes-shell {
                gap: var(--space-2);
            }

            .list-toolbar,
            .editor-head {
                padding: var(--space-2);
            }

            .toolbar {
                padding: var(--space-2);
            }

            .tags-row {
                padding: var(--space-2);
                flex-wrap: wrap;
            }

            .tags-row label {
                width: 100%;
                margin-bottom: 4px;
            }

            #noteTags {
                width: 100%;
            }

            .add-btn {
                bottom: var(--space-3);
                right: var(--space-3);
                width: 56px;
                height: 56px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

        <div class="notes-shell" id="shell">

                    <input type="search" id="searchInput" placeholder="Search notes…" oninput="renderList()">
                    <div class="list-controls">

                            <option value="alpha">A–Z</option>

                        <button class="chip-btn" id="filterPinned" onclick="setFilter('pinned')">Pinned</button>

                </div>

                <div id="editorMain" style="display:none;flex-direction:column;flex:1;min-height:0;">
                    <div class="editor-head">
                        <div class="editor-head-row">
                            <button class="back-btn" onclick="closeEditorMobile()">← Back</button>
                            <input type="text" id="noteTitle" placeholder="Title" oninput="queueSave()">
                        </div>
                        <div class="editor-actions">
                            <button class="icon-btn" id="pinBtn" onclick="togglePinBtn()">Pin</button>
                            <button class="icon-btn" id="archiveBtn" onclick="toggleArchiveBtn()">Archive</button>
                            <button class="icon-btn danger" onclick="deleteCurrentNote()">Delete</button>
                            <span class="save-status" id="saveStatus"></span>
                        </div>
                    </div>
                    <div class="toolbar">
                        <button type="button" onclick="fmt('bold')" title="Bold"><b>B</b></button>
                        <button type="button" onclick="fmt('italic')" title="Italic"><i>I</i></button>
                        <button type="button" onclick="fmt('underline')" title="Underline"><u>U</u></button>
                        <button type="button" onclick="fmt('insertUnorderedList')" title="Bullets">•≡</button>
                        <button type="button" onclick="fmt('insertOrderedList')" title="Numbered">1.</button>
                        <button type="button" onclick="insertChecklist()" title="Checklist">☑</button>
                        <button type="button" onclick="fmt('undo')" title="Undo">↶</button>
                        <button type="button" onclick="fmt('redo')" title="Redo">↷</button>
                        <button type="button" class="font-size-btn" id="fontSizeBtn" onclick="increaseTextSize()" title="Increase text size">A+</button>

                    <div id="noteEditor" contenteditable="true" data-placeholder="Start writing…" oninput="queueSave()"></div>
                    <div class="tags-row">

            </section>

    </main>

    <button class="add-btn" onclick="createNewNote()" title="New note">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <script type="module">
        import { supabase } from './src/supabaseClient.js'
        import { requireAuth } from './src/auth.js'
        import { fetchNotes, createNote, updateNote, deleteNote } from './src/notes.js'

        let notes = []
        let activeId = null
        let filterMode = 'active' // active | pinned | archived
        let saveTimer = null
        let dirty = false

        window.logout = async () => {
            await supabase.auth.signOut()
            window.location.href = '/signin.html'
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
        }

        function stripHtml(html) {
            const d = document.createElement('div')
            d.innerHTML = html || ''
            return (d.textContent || d.innerText || '').trim()
        }

        function sanitizeHtml(html) {
            const allowed = new Set(['B', 'I', 'U', 'UL', 'OL', 'LI', 'DIV', 'BR', 'SPAN', 'P', 'STRONG', 'EM', 'INPUT'])
            const doc = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html')
            const root = doc.body.firstChild

            function clean(node) {
                const kids = Array.from(node.childNodes)
                for (const child of kids) {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        if (!allowed.has(child.tagName)) {
                            while (child.firstChild) node.insertBefore(child.firstChild, child)
                            node.removeChild(child)
                            continue
                        }
                        // strip attrs except checklist
                        const attrs = Array.from(child.attributes || [])
                        for (const a of attrs) {
                            if (child.tagName === 'INPUT') {
                                if (!['type', 'checked', 'data-check-id'].includes(a.name)) child.removeAttribute(a.name)
                                if (a.name === 'type' && a.value !== 'checkbox') child.setAttribute('type', 'checkbox')
                            } else if (child.tagName === 'DIV' || child.tagName === 'SPAN') {
                                if (!['class', 'data-check-id'].includes(a.name)) child.removeAttribute(a.name)
                            } else {
                                child.removeAttribute(a.name)
                            }
                        }
                        clean(child)
                    } else if (child.nodeType === Node.COMMENT_NODE) {
                        node.removeChild(child)
                    }
                }
            }

            if (root) clean(root)
            return root ? root.innerHTML : ''
        }

        function extractChecklist(html) {
            const doc = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html')
            const items = []
            doc.querySelectorAll('input[type="checkbox"][data-check-id]').forEach(input => {
                const id = input.getAttribute('data-check-id')
                const wrap = input.closest('.check-item') || input.parentElement
                const text = (wrap?.textContent || '').trim()
                items.push({ id, text, done: !!input.checked })
            })
            return items
        }

        function relativeTime(iso) {
            if (!iso) return ''
            const d = new Date(iso)
            const diff = (Date.now() - d.getTime()) / 1000
            if (diff < 60) return 'just now'
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`
            if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`
            return d.toLocaleDateString()
        }

        function parseTags(str) {
            return String(str || '')
                .split(',')
                .map(t => t.trim())
                .filter(Boolean)
        }

        window.setFilter = (mode) => {
            filterMode = mode
            document.getElementById('filterActive').classList.toggle('active', mode === 'active')
            document.getElementById('filterPinned').classList.toggle('active', mode === 'pinned')
            document.getElementById('filterArchived').classList.toggle('active', mode === 'archived')
            renderList()
        }

        window.renderList = () => {
            const q = document.getElementById('searchInput').value.trim().toLowerCase()
            const sort = document.getElementById('sortSelect').value
            let list = notes.slice()

            if (filterMode === 'active') list = list.filter(n => !n.isArchived)
            else if (filterMode === 'pinned') list = list.filter(n => n.isPinned && !n.isArchived)
            else if (filterMode === 'archived') list = list.filter(n => n.isArchived)

            if (q) {
                list = list.filter(n =>
                    n.title.toLowerCase().includes(q) ||
                    stripHtml(n.contentHtml).toLowerCase().includes(q) ||
                    n.tags.some(t => t.toLowerCase().includes(q))
                )
            }

            if (sort === 'alpha') list.sort((a, b) => a.title.localeCompare(b.title))
            else list.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))

            // pinned first within active
            if (filterMode === 'active') {
                list.sort((a, b) => (b.isPinned - a.isPinned) || (new Date(b.updatedAt) - new Date(a.updatedAt)))
            }

            const el = document.getElementById('noteList')
            if (!list.length) {
                el.innerHTML = `<div class="list-empty">${q ? 'No matches' : 'No notes yet'}</div>`
                return
            }

            el.innerHTML = list.map(n => `
                <div class="note-row${n.id === activeId ? ' active' : ''}" onclick="selectNote('${n.id}')">
                    <button type="button" class="note-row-del" title="Delete note" onclick="event.stopPropagation();quickDeleteNote('${n.id}')">×</button>
                    <div class="nr-title">${n.isPinned ? '📌 ' : ''}${escapeHtml(n.title || 'Untitled')}</div>
                    <div class="nr-snippet">${escapeHtml(stripHtml(n.contentHtml).slice(0, 80) || 'Empty note')}</div>
                    <div class="nr-meta">
                        <span>${relativeTime(n.updatedAt)}</span>
                        ${n.tags.slice(0, 3).map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}
                    </div>
                </div>
            `).join('')
        }

        function showEditor(show) {
            document.getElementById('editorEmpty').style.display = show ? 'none' : 'flex'
            document.getElementById('editorMain').style.display = show ? 'flex' : 'none'
            document.getElementById('shell').classList.toggle('editing', !!show && !!activeId)
        }

        const FONT_SIZE_ORDER = ['sm', 'base', 'lg', 'xl']
        const FONT_SIZE_MAP = {
            sm: '0.875rem',
            base: '1rem',
            lg: '1.125rem',
            xl: '1.25rem'
        }

        function applyTextSize(size) {
            const editor = document.getElementById('noteEditor')
            const btn = document.getElementById('fontSizeBtn')
            const nextSize = FONT_SIZE_MAP[size] ? size : 'base'
            editor.style.fontSize = FONT_SIZE_MAP[nextSize]
            if (btn) btn.textContent = nextSize === 'sm' ? 'A−' : nextSize === 'base' ? 'A' : 'A+'
            localStorage.setItem('notes-font-size', nextSize)
        }

        window.increaseTextSize = () => {
            const current = localStorage.getItem('notes-font-size') || 'base'
            const idx = FONT_SIZE_ORDER.indexOf(current)
            const next = FONT_SIZE_ORDER[Math.min(idx + 1, FONT_SIZE_ORDER.length - 1)]
            applyTextSize(next)
        }

        

        window.selectNote = (id) => {
            // flush pending save
            if (dirty && activeId) flushSave()
            activeId = id
            const n = notes.find(x => x.id === id)
            if (!n) return
            document.getElementById('noteTitle').value = n.title
            document.getElementById('noteEditor').innerHTML = n.contentHtml || ''
            document.getElementById('noteTags').value = (n.tags || []).join(', ')
            document.getElementById('pinBtn').classList.toggle('on', n.isPinned)
            document.getElementById('archiveBtn').classList.toggle('on', n.isArchived)
            document.getElementById('pinBtn').textContent = n.isPinned ? 'Pinned' : 'Pin'
            document.getElementById('archiveBtn').textContent = n.isArchived ? 'Archived' : 'Archive'
            document.getElementById('saveStatus').textContent = ''
            applyTextSize(localStorage.getItem('notes-font-size') || 'base')
            showEditor(true)
            bindChecklistHandlers()
            renderList()
        }

        window.closeEditorMobile = () => {
            if (dirty && activeId) flushSave()
            activeId = null
            showEditor(false)
            document.getElementById('shell').classList.remove('editing')
            renderList()
        }

        window.createNewNote = async () => {
            if (dirty && activeId) await flushSave()
            const res = await createNote({ title: 'Untitled', contentHtml: '' })
            if (!res.success) { alert(res.error || 'Failed to create'); return }
            notes = await fetchNotes()
            selectNote(res.note.id)
            document.getElementById('noteTitle').focus()
            document.getElementById('noteTitle').select()
        }

        window.fmt = (cmd) => {
            document.getElementById('noteEditor').focus()
            document.execCommand(cmd, false, null)
            queueSave()
        }

        window.insertChecklist = () => {
            const id = 'c_' + Math.random().toString(36).slice(2, 9)
            document.getElementById('noteEditor').focus()
            const html = `<div class="check-item" data-check-id="${id}"><input type="checkbox" data-check-id="${id}"><span>Checklist item</span></div><div><br></div>`
            document.execCommand('insertHTML', false, html)
            bindChecklistHandlers()
            queueSave()
        }

        function bindChecklistHandlers() {
            document.querySelectorAll('#noteEditor input[type="checkbox"]').forEach(cb => {
                cb.onchange = () => {
                    const wrap = cb.closest('.check-item')
                    if (wrap) wrap.classList.toggle('done', cb.checked)
                    queueSave()
                }
            })
        }

        window.togglePinBtn = async () => {
            if (!activeId) return
            const n = notes.find(x => x.id === activeId)
            if (!n) return
            const res = await updateNote(activeId, { isPinned: !n.isPinned })
            if (!res.success) { alert(res.error || 'Failed'); return }
            notes = await fetchNotes()
            selectNote(activeId)
        }

        window.toggleArchiveBtn = async () => {
            if (!activeId) return
            const n = notes.find(x => x.id === activeId)
            if (!n) return
            const res = await updateNote(activeId, { isArchived: !n.isArchived })
            if (!res.success) { alert(res.error || 'Failed'); return }
            notes = await fetchNotes()
            if (filterMode === 'active' && res.note.isArchived) {
                activeId = null
                showEditor(false)
                renderList()
            } else {
                selectNote(activeId)
            }
        }

        async function removeNoteById(id) {
            if (!id) return false
            if (!confirm('Delete this note permanently?')) return false
            const res = await deleteNote(id)
            if (!res.success) { alert(res.error || 'Failed'); return false }
            if (activeId === id) {
                activeId = null
                dirty = false
                showEditor(false)
            }
            notes = notes.filter(n => n.id !== id)
            renderList()
            return true
        }

        window.deleteCurrentNote = async () => {
            if (!activeId) return
            await removeNoteById(activeId)
        }

        window.quickDeleteNote = async (id) => {
            await removeNoteById(id)
        }

        window.queueSave = () => {
            if (!activeId) return
            dirty = true
            const st = document.getElementById('saveStatus')
            st.textContent = 'Unsaved…'
            st.className = 'save-status'
            clearTimeout(saveTimer)
            saveTimer = setTimeout(flushSave, 800)
        }

        async function flushSave() {
            if (!activeId || !dirty) return
            const st = document.getElementById('saveStatus')
            st.textContent = 'Saving…'
            st.className = 'save-status saving'

            const title = document.getElementById('noteTitle').value.trim() || 'Untitled'
            const raw = document.getElementById('noteEditor').innerHTML
            const contentHtml = sanitizeHtml(raw)
            const checklist = extractChecklist(contentHtml)
            const tags = parseTags(document.getElementById('noteTags').value)

            const res = await updateNote(activeId, { title, contentHtml, checklist, tags })
            if (!res.success) {
                st.textContent = 'Save failed'
                st.className = 'save-status'
                return
            }
            dirty = false
            // update local cache without full refetch flicker
            const idx = notes.findIndex(n => n.id === activeId)
            if (idx >= 0) notes[idx] = res.note
            else notes = await fetchNotes()
            st.textContent = 'Saved'
            st.className = 'save-status saved'
            renderList()
        }

        async function init() {
            const user = await requireAuth()
            if (!user) return

            const { data: profile } = await supabase
                .from('user_profile').select('username').eq('id', user.id).single()
                profile?.username || user.email?.split('@')[0] || 'User'

            notes = await fetchNotes()
            renderList()
            showEditor(false)
            applyTextSize(localStorage.getItem('notes-font-size') || 'base')

            // checklist clicks after paste etc.
            document.getElementById('noteEditor').addEventListener('click', () => bindChecklistHandlers())
        }

        init()
    </script>
</body>
</html>
