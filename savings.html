<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings - MultiTracker</title>
    <link rel="stylesheet" href="/src/theme.css">
    <link rel="stylesheet" href="/src/nav.css">
    <style>
        /* ─────────────────────────────────────────────────────────────
           PAGE-SPECIFIC STYLES
           ───────────────────────────────────────────────────────────── */

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-3);
        }

        /* Card Image Area */
        .card-image {
            width: 100%;
            height: 120px;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        .card-emoji-badge {
            width: 64px;
            height: 64px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform var(--duration-normal) var(--ease-out-expo);
        }

        .savings-card:hover .card-emoji-badge {
            transform: scale(1.05);
        }

        .card-settings {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            z-index: 10;
        }

        .card-settings:hover {
            background: var(--accent-muted);
            border-color: var(--accent);
            transform: rotate(45deg);
        }

        .card-settings svg {
            width: 14px;
            height: 14px;
            fill: var(--accent);
        }

        /* Card Body */
        .card-body {
            padding: var(--space-3);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-description {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
            line-height: var(--leading-relaxed);
            flex-grow: 1;
        }

        /* Progress */
        .progress-container {
            margin-bottom: var(--space-2);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--space-1);
            font-size: var(--text-sm);
        }

        .progress-amount {
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-percent {
            color: var(--accent);
            font-weight: 700;
        }

        /* Deadline Badge */
        .deadline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-bottom: var(--space-2);
            background: var(--bg-elevated);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-weight: 600;
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .deadline-badge.overdue {
            background: var(--error-bg);
            color: var(--error);
            border-color: var(--error-border);
        }

        /* Card Actions */
        .card-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: auto;
        }

        .btn-withdraw {
            flex: 1;
            padding: 11px 16px;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-withdraw:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }

        /* Daily Savings */
        .daily-savings {
            background: var(--bg-elevated);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            text-align: center;
            border: 1px solid var(--border);
        }

        .daily-savings-label {
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: var(--tracking-eyebrow);
        }

        .daily-savings-value {
            font-size: var(--text-2xl);
            font-weight: 800;
            color: var(--accent);
        }

        /* Deposit Options */
        .deposit-options {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .deposit-option {
            flex: 1;
            padding: var(--space-2);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .deposit-option:hover {
            border-color: var(--border-strong);
        }

        .deposit-option.selected {
            border-color: var(--accent);
            background: var(--accent-muted);
        }

        .deposit-option-value {
            font-size: var(--text-base);
            font-weight: 700;
            color: var(--text-primary);
        }

        .deposit-option-label {
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Image Picker */
        .image-picker {
            display: flex;
            gap: var(--space-1);
            flex-wrap: wrap;
        }

        .image-option {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-base);
            background: var(--bg-elevated);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .image-option:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }

        .image-option.selected {
            border-color: var(--accent);
            background: var(--accent-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--space-7) var(--space-3);
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border);
            max-width: 500px;
            margin: var(--space-5) auto;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: var(--space-3);
            opacity: 0.5;
        }

        /* Modal Delete Button */
        .modal-delete-btn {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid var(--error-border);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            font-size: var(--text-sm);
            margin-right: auto;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .modal-delete-btn:hover {
            background: var(--error);
            color: white;
        }

        /* ─────────────────────────────────────────────────────────────
           RESPONSIVE
           ───────────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
                gap: var(--space-2);
            }

            .modal-body,
            .modal-header,
            .modal-footer {
                padding: var(--space-2);
            }

            .image-picker {
                gap: 6px;
                justify-content: center;
            }

            .image-option {
                width: 40px;
                height: 40px;
                font-size: var(--text-sm);
            }

            .deposit-options {
                flex-direction: column;
                gap: var(--space-1);
            }

            .modal-footer {
                flex-direction: column-reverse;
                gap: var(--space-1);
            }

            .modal-footer button,
            .modal-footer .modal-delete-btn {
                width: 100%;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Multi<span>Tracker</span></div>
            <div class="nav-links">
                <a href="tasks.html">Tasks</a>
                <a href="schedule.html">Schedule</a>
                <a href="notes.html">Notes</a>
                <a href="savings.html" class="active">Savings</a>
                <a href="profile.html">Profile</a>
            </div>
        </div>
    </nav>

    <main>
        <h1>Your Savings Goals</h1>
        <div class="cards-grid" id="cardsGrid"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🎯</div>
            <h3>No savings goals yet</h3>
            <p>Click the button below to create your first goal.</p>
        </div>
    </main>

    <!-- FAB -->
    <button class="add-btn" onclick="openCreateModal()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="createModal" onclick="if(event.target === this) closeCreateModal()">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Create Savings Goal</h2>
                <button class="modal-close" onclick="closeCreateModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Goal Name</label>
                    <input type="text" id="goalName" placeholder="e.g., Japan Vacation">
                </div>

                <div class="form-group">
                    <label>Icon</label>
                    <div class="image-picker" id="imagePicker">
                        <div class="image-option selected" data-emoji="🎯">🎯</div>
                        <div class="image-option" data-emoji="🚗">🚗</div>
                        <div class="image-option" data-emoji="🏠">🏠</div>
                        <div class="image-option" data-emoji="💻">💻</div>
                        <div class="image-option" data-emoji="📚">📚</div>
                        <div class="image-option" data-emoji="💍">💍</div>
                        <div class="image-option" data-emoji="🎮">🎮</div>
                        <div class="image-option" data-emoji="✈️">✈️</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Target Amount (₱)</label>
                    <input type="number" id="targetAmount" placeholder="e.g. 50000" min="1">
                </div>

                <div class="form-group">
                    <label>Deadline (Optional)</label>
                    <input type="date" id="deadline">
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="goalNotes" placeholder="What are you saving for?"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-delete-btn" id="deleteBtn" style="display: none;" onclick="triggerDeleteGoal()">Delete Goal</button>
                <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
                <button class="btn-primary" id="saveBtn" onclick="saveGoal()">Create Goal</button>
            </div>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal-overlay" id="depositModal" onclick="if(event.target === this) closeDepositModal()">
        <div class="modal">
            <div class="modal-header">
                <h2>Deposit to Goal</h2>
                <button class="modal-close" onclick="closeDepositModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="daily-savings">
                    <div class="daily-savings-label">Daily Savings Target</div>
                    <div class="daily-savings-value" id="dailySavings">₱0</div>
                </div>

                <div class="deposit-options" id="depositOptions">
                    <div class="deposit-option" onclick="selectDeposit(this)">
                        <div class="deposit-option-value" id="quickDeposit1">₱0</div>
                        <div class="deposit-option-label">Daily</div>
                    </div>
                    <div class="deposit-option" onclick="selectDeposit(this)">
                        <div class="deposit-option-value" id="quickDeposit7">₱0</div>
                        <div class="deposit-option-label">Weekly</div>
                    </div>
                    <div class="deposit-option selected" onclick="selectDeposit(this)">
                        <div class="deposit-option-value" id="quickDeposit30">₱0</div>
                        <div class="deposit-option-label">Monthly</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Custom Amount (₱)</label>
                    <input type="number" class="custom-input" id="customDeposit" placeholder="Enter amount" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeDepositModal()">Cancel</button>
                <button class="btn-primary" onclick="makeDeposit()">Deposit</button>
            </div>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal-overlay" id="withdrawModal" onclick="if(event.target === this) closeWithdrawModal()">
        <div class="modal">
            <div class="modal-header">
                <h2>Withdraw from Goal</h2>
                <button class="modal-close" onclick="closeWithdrawModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Withdrawal Amount (₱)</label>
                    <input type="number" class="custom-input" id="withdrawAmount" placeholder="Enter amount" min="1">
                </div>
                <p style="font-size: var(--text-sm); color: var(--text-secondary);">Current balance: <strong id="currentBalance" style="color: var(--text-primary);">₱0</strong></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeWithdrawModal()">Cancel</button>
                <button class="btn-primary" onclick="makeWithdrawal()">Withdraw</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './src/supabaseClient.js'
        import { fetchGoals, createGoal, updateGoal, deleteGoal, depositToGoal, withdrawFromGoal } from './src/goals.js'

        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser()
            if (!user) {
                window.location.href = '/signin.html'
                return null
            }
            return user
        }

        async function getUsername() {
            const { data: { user } } = await supabase.auth.getUser()
            if (!user) return 'User'
            const { data: profile } = await supabase
                .from('user_profile')
                .select('username')
                .eq('id', user.id)
                .single()
            return profile?.username || user.email?.split('@')[0] || 'User'
        }

        window.logout = async function() {
            await supabase.auth.signOut()
            window.location.href = '/signin.html'
        }

        let goals = [];
        let currentGoalId = null;
        let selectedEmoji = '🎯';
        let editingGoalId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth()
            if (!user) return
            goals = await fetchGoals();
            renderGoals();
            setupImagePicker();
        });

        function renderGoals() {
            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');

            if (goals.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            grid.innerHTML = goals.map(goal => {
                const progress = (goal.current / goal.target) * 100;
                const daysLeft = goal.deadline ? Math.ceil((new Date(goal.deadline) - new Date()) / (1000 * 60 * 60 * 24)) : null;

                let deadlineHtml = '';
                if (daysLeft !== null) {
                    if (daysLeft < 0) {
                        deadlineHtml = `<div class="deadline-badge overdue">⏳ Overdue by ${Math.abs(daysLeft)} days</div>`;
                    } else if (daysLeft === 0) {
                        deadlineHtml = `<div class="deadline-badge overdue" style="background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border);">⏳ Due today!</div>`;
                    } else {
                        deadlineHtml = `<div class="deadline-badge">⏳ ${daysLeft} days left</div>`;
                    }
                }

                return `
                    <div class="savings-card">
                        <div class="card-image">
                            <div class="card-emoji-badge">${goal.emoji}</div>
                            <div class="card-settings" onclick="openEditModal('${goal.id}')">
                                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${goal.name}</div>
                            <div class="card-description">${goal.notes || 'No description'}</div>

                            <div class="progress-container">
                                <div class="progress-header">
                                    <span class="progress-amount">₱${goal.current.toLocaleString()} / ₱${goal.target.toLocaleString()}</span>
                                    <span class="progress-percent">${Math.min(100, Math.round(progress))}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="transform: scaleX(${Math.min(progress, 100) / 100})"></div>
                                </div>
                            </div>

                            ${deadlineHtml}

                            <div class="card-actions">
                                <button class="btn-primary" onclick="openDepositModal('${goal.id}')">Deposit</button>
                                <button class="btn-withdraw" onclick="openWithdrawModal('${goal.id}')">Withdraw</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setupImagePicker() {
            const picker = document.getElementById('imagePicker');
            picker.querySelectorAll('.image-option').forEach(option => {
                option.addEventListener('click', () => {
                    picker.querySelectorAll('.image-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedEmoji = option.dataset.emoji;
                });
            });
        }

        window.openCreateModal = function() {
            editingGoalId = null;
            document.getElementById('modalTitle').textContent = 'Create Savings Goal';
            document.getElementById('goalName').value = '';
            document.getElementById('targetAmount').value = '';
            document.getElementById('deadline').value = '';
            document.getElementById('goalNotes').value = '';
            document.getElementById('saveBtn').textContent = 'Create Goal';
            document.getElementById('deleteBtn').style.display = 'none';

            const picker = document.getElementById('imagePicker');
            picker.querySelectorAll('.image-option').forEach(o => o.classList.remove('selected'));
            picker.querySelector('.image-option').classList.add('selected');
            selectedEmoji = '🎯';

            const overlay = document.getElementById('createModal');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
        }

        window.openEditModal = function(goalId) {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            editingGoalId = goalId;
            document.getElementById('modalTitle').textContent = 'Edit Savings Goal';
            document.getElementById('goalName').value = goal.name;
            document.getElementById('targetAmount').value = goal.target;
            document.getElementById('deadline').value = goal.deadline || '';
            document.getElementById('goalNotes').value = goal.notes || '';
            document.getElementById('saveBtn').textContent = 'Save Changes';
            document.getElementById('deleteBtn').style.display = 'block';

            const picker = document.getElementById('imagePicker');
            picker.querySelectorAll('.image-option').forEach(o => {
                o.classList.remove('selected');
                if (o.dataset.emoji === goal.emoji) {
                    o.classList.add('selected');
                    selectedEmoji = goal.emoji;
                }
            });

            const overlay = document.getElementById('createModal');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
        }

        window.closeCreateModal = function() {
            const overlay = document.getElementById('createModal');
            overlay.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 300);
        }

        window.saveGoal = async function() {
            const name = document.getElementById('goalName').value.trim();
            const target = parseFloat(document.getElementById('targetAmount').value);
            const deadline = document.getElementById('deadline').value;
            const notes = document.getElementById('goalNotes').value.trim();

            if (!name || !target || target <= 0) {
                alert('Please enter a valid name and target amount');
                return;
            }

            const goalData = {
                name,
                target,
                deadline: deadline || null,
                notes,
                emoji: selectedEmoji
            };

            if (editingGoalId) {
                const result = await updateGoal(editingGoalId, goalData);
                if (result.success) {
                    const goalIndex = goals.findIndex(g => g.id === editingGoalId);
                    if (goalIndex !== -1) {
                        goals[goalIndex] = result.goal;
                    }
                } else {
                    alert('Failed to update goal: ' + result.error);
                    return;
                }
            } else {
                const result = await createGoal(goalData);
                if (result.success) {
                    goals.unshift(result.goal);
                } else {
                    alert('Failed to create goal: ' + result.error);
                    return;
                }
            }

            closeCreateModal();
            renderGoals();
        }

        window.triggerDeleteGoal = async function() {
            if (!editingGoalId) return;
            if (!confirm('Are you sure you want to delete this savings goal?')) return;

            const result = await deleteGoal(editingGoalId);
            if (result.success) {
                goals = goals.filter(g => g.id !== editingGoalId);
                closeCreateModal();
                renderGoals();
            } else {
                alert('Failed to delete goal: ' + result.error);
            }
        }

        window.openDepositModal = function(goalId) {
            currentGoalId = goalId;
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            const daysLeft = goal.deadline ? Math.ceil((new Date(goal.deadline) - new Date()) / (1000 * 60 * 60 * 24)) : null;
            const remaining = goal.target - goal.current;
            const dailyAmount = daysLeft && daysLeft > 0 ? Math.max(0, Math.round(remaining / daysLeft)) : 0;

            document.getElementById('dailySavings').textContent = '₱' + dailyAmount.toLocaleString();
            document.getElementById('quickDeposit1').textContent = '₱' + dailyAmount.toLocaleString();
            document.getElementById('quickDeposit7').textContent = '₱' + (dailyAmount * 7).toLocaleString();
            document.getElementById('quickDeposit30').textContent = '₱' + (dailyAmount * 30).toLocaleString();
            document.getElementById('customDeposit').value = dailyAmount > 0 ? dailyAmount : 500;

            document.querySelectorAll('.deposit-option').forEach(o => o.classList.remove('selected'));
            document.getElementById('depositOptions').children[2].classList.add('selected')

            const overlay = document.getElementById('depositModal');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
        }

        window.closeDepositModal = function() {
            const overlay = document.getElementById('depositModal');
            overlay.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 300);
        }

        window.selectDeposit = function(element) {
            document.querySelectorAll('.deposit-option').forEach(o => o.classList.remove('selected'));
            element.classList.add('selected');
            const valStr = element.querySelector('.deposit-option-value').textContent.replace('₱', '').replace(/,/g, '');
            document.getElementById('customDeposit').value = parseInt(valStr) || 0;
        }

        window.makeDeposit = async function() {
            const amount = parseFloat(document.getElementById('customDeposit').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            const result = await depositToGoal(currentGoalId, amount);
            if (result.success) {
                const goalIndex = goals.findIndex(g => g.id === currentGoalId);
                if (goalIndex !== -1) {
                    goals[goalIndex] = result.goal;
                }
                closeDepositModal();
                renderGoals();
            } else {
                alert('Failed to deposit: ' + result.error);
            }
        }

        window.openWithdrawModal = function(goalId) {
            currentGoalId = goalId;
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            document.getElementById('currentBalance').textContent = '₱' + goal.current.toLocaleString();
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('withdrawAmount').max = goal.current;

            const overlay = document.getElementById('withdrawModal');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
        }

        window.closeWithdrawModal = function() {
            const overlay = document.getElementById('withdrawModal');
            overlay.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 300);
        }

        window.makeWithdrawal = async function() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const goalIndex = goals.findIndex(g => g.id === currentGoalId);

            if (goalIndex === -1) return;

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            if (amount > goals[goalIndex].current) {
                alert('Cannot withdraw more than current balance');
                return;
            }

            const result = await withdrawFromGoal(currentGoalId, amount);
            if (result.success) {
                goals[goalIndex] = result.goal;
                closeWithdrawModal();
                renderGoals();
            } else {
                alert('Failed to withdraw: ' + result.error);
            }
        }
    </script>
</body>
</html>
